# Demo configuration: points at the tiny SYNTHETIC files in data/sample/ so the whole
# pipeline can be exercised without downloading the real (large) datasets.
#   python -m supplychain360.cli --config config/datasets.sample.yaml
sources:
  m5:
    description: SYNTHETIC sample shaped like the M5 Forecasting files
    directory: data/sample/m5
    expected_files: [sales_train_validation.csv, calendar.csv, sell_prices.csv]
    allowed_extensions: [.csv]
    license_note: Synthetic sample generated by scripts/generate_sample_data.py (not real data).
  dataco:
    description: SYNTHETIC sample shaped like the DataCo Smart Supply Chain file
    directory: data/sample/dataco
    expected_files: [DataCoSupplyChainDataset.csv]
    allowed_extensions: [.csv]
    license_note: Synthetic sample generated by scripts/generate_sample_data.py (not real data).
  olist:
    description: SYNTHETIC sample shaped like the Olist Brazilian E-Commerce files
    directory: data/sample/olist
    expected_files:
      - olist_orders_dataset.csv
      - olist_order_items_dataset.csv
      - olist_products_dataset.csv
      - olist_customers_dataset.csv
      - olist_sellers_dataset.csv
      - product_category_name_translation.csv
    allowed_extensions: [.csv]
    license_note: Synthetic sample generated by scripts/generate_sample_data.py (not real data).
